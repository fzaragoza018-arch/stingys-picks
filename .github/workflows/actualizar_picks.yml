name: Actualizador Automatico Stingys Picks

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python actualizar.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Stingys Bot"
          git config --global user.email "bot@stingyspicks.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de partidos y picks" && git push)
